<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Animated Quantity Selector</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="image">🍕</div>
        <div>
          <h3>Margherita Pizza</h3>
          <p>Freshly baked · Classic cheese</p>
          <div class="price">£8.50 each</div>
        </div>
      </div>

      <div class="bottom">
        <div class="stepper">
          <button id="minus">-</button>
          <span id="count">1</span>
          <button id="plus">+</button>
        </div>

        <div class="label">TOTAL PRICE</div>
        <div id="total">£8.50</div>
      </div>
    </div>
  </body>
</html>
